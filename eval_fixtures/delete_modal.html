<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>delete modal</title>
<style>
  html, body { margin: 0; background: #123456; color: #fff; font-family: sans-serif; }
  body { padding: 24px; }
  button { margin: 8px; padding: 8px; font-size: 16px; }
</style>
</head>
<body>
<div role="dialog" data-modal="1">
  <h2>Delete this file</h2>
  <button type="button" id="ok">Confirm</button>
</div>
<p id="out"></p>
<script>
document.getElementById("ok").onclick = function () {
  document.getElementById("out").textContent = "Deleted";
};
</script>
</body>
</html>
