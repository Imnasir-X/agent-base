<!DOCTYPE html><html><head><meta charset="utf-8"><title>Form</title><style>html,body{margin:0;background:#123456;color:#fff;font-family:sans-serif} body{padding:24px} a,button,input,select,textarea{margin:8px;padding:8px;font-size:16px} .spacer{height:1800px}</style></head><body><form id="f"><label for="name">Name</label><input id="name">
<label for="email">Email</label><input id="email">
<label for="color">Color</label><select id="color"><option value="">Choose</option><option value="blue">Blue</option><option value="red">Red</option></select>
<label for="agree">Agree</label><input id="agree" type="checkbox">
<button type="submit">Submit</button><p id="out"></p></form>
<script>document.getElementById('f').onsubmit=function(e){e.preventDefault();var n=document.getElementById('name').value;var m=document.getElementById('email').value;if(n&&m)document.getElementById('out').textContent='Submitted';}</script></body></html>
