<!DOCTYPE html><html><head><meta charset="utf-8"><title>captcha_delay</title><style>html,body{margin:0;background:#123456;color:#fff;font-family:sans-serif}body{padding:24px}a,button,input,select,textarea{margin:8px;padding:8px;font-size:16px}</style></head><body><div id="decoys"></div><script>for(let i=1;i<=18;i++){const a=document.createElement("a");a.href="gone.html";a.textContent="Leave "+i;document.getElementById("decoys").appendChild(a);}</script><script>setTimeout(function(){var lab=document.createElement("label");lab.htmlFor="human";lab.textContent="I am human";var box=document.createElement("input");box.id="human";box.type="checkbox";document.body.appendChild(lab);document.body.appendChild(box);},1200);</script></body></html>
