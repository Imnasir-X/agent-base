<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buttons</title><style>html,body{margin:0;background:#123456;color:#fff;font-family:sans-serif} body{padding:24px} a,button,input,select,textarea{margin:8px;padding:8px;font-size:16px} .spacer{height:1800px}</style></head><body><button type="button" id="save">Save draft</button><button type="button" id="pub">Publish</button><p id="out"></p><script>document.getElementById("save").onclick=function(){document.getElementById("out").textContent="Draft saved"};document.getElementById("pub").onclick=function(){document.getElementById("out").textContent="Published"}</script></body></html>
